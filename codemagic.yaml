workflows:
  ios-app-store:
    name: iOS App Store
    max_build_duration: 60
    integrations:
      app_store_connect: siriplan_api_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.siriplan.app
      vars:
        XCODE_WORKSPACE: "src/SiriPlan.xcworkspace"
        XCODE_SCHEME: "SiriPlan"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          cd src && pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
